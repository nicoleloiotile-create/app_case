<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Case">
<title>Le nostre case</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css?v=2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="login" class="login" hidden>
  <h1>Le nostre case</h1>
  <p class="mut">Inserisci il PIN per entrare.</p>
  <input id="pin" type="password" inputmode="numeric" placeholder="PIN" onkeydown="if(event.key=='Enter')tryPin()">
  <button class="btn" type="button" onclick="tryPin()">Entra</button>
  <p class="mut" id="lmsg"></p>
</div>
<div id="shell" hidden>
<div class="app">
  <header>
    <div><h1 id="ttl">Le nostre case</h1><div class="sub" id="sub">Caricamento…</div></div>
    <button class="me" id="me" type="button"></button>
  </header>
  <div class="tabs" id="tabs"></div>
  <main id="main"></main>
</div>
<button class="fab" id="fab" type="button" aria-label="Aggiungi casa">+</button>
<nav><div>
  <button type="button" data-v="case" class="on"><b>⌂</b>Case</button>
  <button type="button" data-v="cal"><b>▦</b>Visite</button>
  <button type="button" data-v="conf"><b>≡</b>Confronto</button>
</div></nav>
</div>
<div class="sheet" id="sheet" hidden><div class="sin" id="det"></div></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="app.js?v=2"></script>
</body>
</html>
